# armada-trackpad-daemon: loaded on the left pad composite; its only source is the left virtual pad.
# No target_devices key: setting targets there could stop the shared Steam Deck controller.
version: 1
kind: DeviceProfile
name: Armada Trackpad (left pad)
mapping:
- name: Left virtual pad to left trackpad
  source_event:
    touchscreen:
      motion: {}
  target_events:
  - touchpad:
      name: LeftPad
      touch:
        motion: {}
