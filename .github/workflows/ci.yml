name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python and the one Armada ships.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # Also runs shellcheck on the shell scripts, from the shellcheck-py dev dependency.
      - run: uv run pytest
      - run: uv run ruff check
      - run: uv run ruff format --check src tests dev
      - run: uv run mypy

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The image scripts/vale.sh runs locally; styles come from the Packages URL in .vale.ini.
      - name: Vale
        run: |
          image="$(sed -n 's/^IMAGE="\(.*\)"$/\1/p' scripts/vale.sh)"
          docker run --rm -v "$PWD:/work" -w /work "$image" sync
          git ls-files -z '*.md' | xargs -0 docker run --rm -v "$PWD:/work" -w /work --network none "$image"
