# Prose lint for the docs: the vale hooks in .pre-commit-config.yaml.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Project

# Pinned by release URL; `vale sync` downloads it into .vale/styles/.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = Vale, ai-tells
# Fires on every proper noun after a colon (Steam, Retroid, button names), which these docs use a lot.
ai-tells.ColonUsage = NO
